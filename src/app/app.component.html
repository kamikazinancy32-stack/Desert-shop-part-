<main class="layout">
  <app-product-list
    class="layout__products"
    [products]="products"
    [cartItems]="cartItems"
    (add)="addToCart($event)"
    (decrease)="decreaseQuantity($event)"
  ></app-product-list>

  <app-cart
    class="layout__cart"
    [items]="cartItems"
    [totalQuantity]="totalQuantity"
    [totalPrice]="totalPrice"
    (remove)="removeFromCart($event)"
    (confirm)="confirmOrder()"
  ></app-cart>
</main>

<app-order-confirmation
  *ngIf="isOrderConfirmed"
  [items]="cartItems"
  [totalPrice]="totalPrice"
  (startNew)="startNewOrder()"
></app-order-confirmation>

<app-toast [message]="toastMessage"></app-toast>
