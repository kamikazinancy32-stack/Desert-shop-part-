<div class="overlay">
  <div
    class="modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="confirm-title"
    aria-describedby="confirm-text"
  >
    <img src="assets/images/icon-order-confirmed.svg" alt="" width="48" height="48" />
    <h2 id="confirm-title" class="modal__title">Order Confirmed</h2>
    <p id="confirm-text" class="modal__text">We hope you enjoy your food!</p>

    <div class="summary">
      <ul>
        <li *ngFor="let item of items; trackBy: trackByName" class="summary__item">
          <img
            class="summary__thumb"
            [src]="item.product.image.thumbnail"
            [alt]="item.product.name"
            width="48"
            height="48"
          />
          <div class="summary__info">
            <p class="summary__name">{{ item.product.name }}</p>
            <p class="summary__meta">
              <span class="summary__qty">{{ item.quantity }}x</span>
              <span class="summary__unit">&#64; {{ item.product.price | currency: 'USD' }}</span>
            </p>
          </div>
          <p class="summary__line">{{ item.product.price * item.quantity | currency: 'USD' }}</p>
        </li>
      </ul>

      <div class="summary__total">
        <span>Order Total</span>
        <strong>{{ totalPrice | currency: 'USD' }}</strong>
      </div>
    </div>

    <button #startButton type="button" class="btn-primary" (click)="startNew.emit()">
      Start New Order
    </button>
  </div>
</div>
